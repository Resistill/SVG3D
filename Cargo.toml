[workspace]
resolver = "2"
members = ["crates/s3d-geom", "crates/s3d-lang", "crates/s3d-score", "crates/s3d-wasm", "crates/s3d-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
# 数学：f64，走 libm，关 SIMD（原则 18）
glam = { version = "0.34", default-features = false, features = ["f64", "libm", "scalar-math"] }
libm = "0.2"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
earcutr = "0.5"

[profile.release]
# 不开任何可能改变浮点结果的优化；确定性优先
opt-level = 3
lto = false
codegen-units = 16
debug = false
