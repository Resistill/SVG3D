[package]
name = "s3d-wasm"
description = "SVG3D 的 wasm 入口（裸 C ABI，不依赖 wasm-bindgen）：浏览器 / node 里编译并取 JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
s3d-lang = { path = "../s3d-lang" }
s3d-geom = { path = "../s3d-geom" }
s3d-score = { path = "../s3d-score" }
serde_json = { workspace = true }
